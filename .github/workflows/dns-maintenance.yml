name: DNS maintenance legacy (disabled)

on:
  workflow_dispatch:

# The legacy Telegram-local engine is intentionally disabled before the v1
# migration. Its source files remain in the repository only as a rollback aid.
permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy engine disabled
        run: |
          echo "The legacy Telegram-local DNS maintenance workflow is disabled."
          echo "Use 'DNS maintenance v1 pilot' for read-only checks."
          echo "Use 'DNS maintenance v1 migration' only for the controlled v1 write migration."
